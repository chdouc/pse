name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check code style
        run: python -m ruff check code tests reproduce.py run_workflow.py validate_outputs.py
      - name: Check types
        run: python -m mypy code tests reproduce.py run_workflow.py validate_outputs.py
      - name: Run tests
        run: python -m pytest -q
      - name: Run deterministic smoke reproduction
        run: python reproduce.py --smoke-test --output-directory artifacts/ci-smoke

  full-reproduction:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce all figures and Movie 2 from source
        run: python reproduce.py --all --workers 2
      - name: Preserve full-reproduction reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-reproduction-reports-${{ github.sha }}
          path: |
            artifacts/reproduction/full/config_used.json
            artifacts/reproduction/full/validation.json
            artifacts/reproduction/full/manifest.json
          if-no-files-found: warn
          retention-days: 30
