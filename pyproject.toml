[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(^|/)(artifacts|tmp|sources|\\.docx_render_check_[^/]*|code/graphical_abstract)/"
